<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'"><title>hPen</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><strong>hPen<span> REMASTER</span></strong><small>실시간 돋보기 · 멈춤 · 필기</small></div><div class="actions"><button id="pin">항상 위</button><button id="hide">잠시 숨김</button></div></header>
<section class="bar shortcut-controls"><label>돋보기 <input id="magnifyKey" type="text" readonly placeholder="클릭 후 키 조합 입력" aria-label="돋보기 단축키"><button data-clear-key="magnifyKey">해제</button></label><label>필기 모드 ↔ 앱 제어 모드 <input id="inputKey" type="text" readonly placeholder="클릭 후 키 조합 입력" aria-label="전환 단축키"><button data-clear-key="inputKey">해제</button></label><button id="applyKeys">저장 · 적용</button><small>입력 칸을 클릭하고 원하는 조합을 누르세요. 기본 전환 키: Alt+백틱</small></section>
<section class="bar capture-controls"><select id="display" aria-label="캡처 모니터"></select><button id="overlay" class="primary">화면에 직접 필기</button><button id="start">실시간 돋보기</button><button id="freeze" disabled>멈춤 · 필기</button><button id="stop" disabled>캡처 종료</button><label>배율 <input id="zoom" type="range" min="1" max="10" step="0.25" value="1"><b id="zoomValue">1×</b></label><label><input id="track" type="checkbox" checked> 커서 추적</label></section>
<section class="bar tools"><button data-tool="pen" class="selected">펜</button><button data-tool="rect" title="Q">사각형</button><button data-tool="ellipse" title="W">원</button><button data-tool="line" title="E">직선</button><button data-tool="reverseArrow" title="R">역화살표</button><button data-tool="arrow" title="F">화살표</button><button data-tool="bothArrow" title="G">양방향</button><button data-tool="cross" title="X">X</button><button data-tool="thunder" title="D">번개</button><button data-tool="curve" title="V">곡선</button><button data-tool="text" title="T">텍스트</button><input id="color" aria-label="필기 색" type="color" value="#ff565e"><label>두께 <input id="width" type="range" min="1" max="16" value="4"></label><label>글자 <input id="textSize" type="range" min="12" max="96" step="2" value="28" aria-label="글자 크기"><b id="textSizeValue">28</b></label><button id="undo">되돌리기</button><button id="redo">다시 실행</button><button id="clear">모두 지우기</button><button id="inputMode" hidden>앱 제어 모드</button><button id="closeOverlay" hidden>숨김</button><button id="settings" hidden>설정</button><div class="spacer"></div><button id="copy">복사</button><button id="save">PNG 저장</button></section>
<main id="stage"><canvas id="canvas"></canvas><div id="empty"><h1>설명하고 싶은 순간을 크게.</h1><p>모니터를 선택하고 실시간 확대를 시작하세요.<br>멈추면 그 화면 위에 필기할 수 있습니다.</p></div><textarea id="editor" wrap="off" spellcheck="false" tabindex="0" aria-label="인라인 텍스트 입력" hidden></textarea></main>
<footer><span id="status" role="status">전역 단축키 사용 안 함 · 버튼과 트레이로 조작하세요.</span><span>창 내부: Space 멈춤 · Esc 숨김 · Ctrl+Z 되돌리기</span></footer><script src="renderer.js"></script></body></html>
